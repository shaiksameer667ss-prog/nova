  The function sort_by_priority in sort_items.py is supposed to sort
  items by priority ascending, while preserving insertion order for
  items of equal priority (stable sort). It currently fails its tests.
  Fix the bug. Do not modify tests.

gold_skill: |
  Diagnostic method for stability bugs in recursive sorts:
  1. Identify where the merge step compares elements from left and
     right partitions.
  2. Determine the tie-breaking rule: on equal keys, which partition's
     element should come first to preserve stability?
  3. Check the comparison operator: < vs <= determines whether ties
     go right or left.
  4. Verify by hand: sort [{p:1,a}, {p:1,b}] and check that 'a' stays
     before 'b'.

